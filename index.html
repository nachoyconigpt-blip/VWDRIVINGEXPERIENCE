<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VW Driving Experience | Ruleta</title>
<link rel="icon" type="image/png" sizes="300x300" href="./VW%20DRIVING%20EXPERIENCE.png">
<link rel="apple-touch-icon" href="./VW%20DRIVING%20EXPERIENCE.png">
<style>
  
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: #FFFFFF;
    color: #001E50;
    font-family: 'VW Head Office', Arial, Helvetica, sans-serif;
    overflow-x: hidden;
  }
  main {
    width: min(100%, 700px, 59vh);
    min-width: min(100%, 320px);
    min-height: 100dvh;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2vh 0 2.2vh;
  }
  .brand {
    width: 66%;
    text-align: center;
    margin-bottom: .8vh;
    color: #001E50;
    text-transform: uppercase;
    line-height: .88;
    letter-spacing: -0.03em;
    user-select:none;
  }
  .brand .line1 {
    font-size: clamp(42px, 8vh, 88px);
    font-weight: 700;
    white-space: nowrap;
  }
  .brand .line2 {
    margin-top: .18em;
    font-size: clamp(42px, 8vh, 88px);
    font-weight: 700;
    white-space: nowrap;
  }

  .heading {
    width: 82%;
    text-align: center;
    color: #001E50;
    text-transform: uppercase;
    line-height: .98;
    margin: 0 0 1.6vh;
    letter-spacing: -0.03em;
  }
  .heading .l1 {
    font-size: clamp(24px, 3.8vh, 40px);
    font-weight: 700;
  }
  .heading .l2 {
    font-size: clamp(26px, 4.2vh, 46px);
    font-weight: 700;
  }
  .stage {
    width: 93%;
    position: relative;
    aspect-ratio: 1;
    isolation: isolate;
  }
  .wheel {
    width: 100%;
    height: 100%;
    display: block;
    transform: rotate(0deg);
    will-change: transform;
  }
  .pointer {
    position: absolute;
    top: -2.3%;
    left: 50%;
    transform: translateX(-50%);
    width: 6.8%;
    height: 8.2%;
    background: #001E50;
    clip-path: polygon(50% 100%, 0 0, 100% 0);
    z-index: 3;
    filter: drop-shadow(0 1px 0 rgba(0,0,0,.06));
  }
  .hub {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 23%;
    aspect-ratio: 1;
    border: clamp(3px,.55vw,5px) solid #001E50;
    border-radius: 50%;
    padding: 2%;
    background: white;
    cursor: pointer;
    overflow: hidden;
    z-index: 2;
    box-shadow: 0 5px 18px rgba(0,30,80,.14);
  }
  .hub img { width: 100%; height: 100%; object-fit: contain; display:block; }
  .hub:focus-visible { outline: 3px solid #001E50; outline-offset: 4px; }
  .hub:disabled { cursor: default; opacity: 1; }
  .footer {
    width: 18%;
    display:block;
    margin: 2.4vh auto .55vh;
  }
  .hint {
    font-size: clamp(10px, 1.2vh, 14px);
    color: #60708a;
    text-align: center;
    margin: .7vh 0 0;
    letter-spacing: .04em;
    text-transform: uppercase;
  }
  .full {
    position: fixed;
    right: 12px;
    bottom: 12px;
    border: 1px solid rgba(0,30,80,.22);
    background: #fff;
    color: #001E50;
    border-radius: 8px;
    padding: 9px 11px;
    cursor: pointer;
    font-size: 17px;
    box-shadow: 0 4px 14px rgba(0,30,80,.08);
  }
  dialog {
    width: min(90vw, 540px);
    background: white;
    color: #001E50;
    border: 2px solid #001E50;
    border-radius: 16px;
    text-align: center;
    padding: 34px 24px 26px;
    box-shadow: 0 30px 90px rgba(0,0,0,.16);
  }
  dialog::backdrop { background: rgba(0,0,0,.28); }
  dialog h2 {
    font-size: clamp(28px, 5vw, 46px);
    margin: 0 0 14px;
    line-height: .95;
    letter-spacing: -.03em;
    text-transform: uppercase;
  }
  dialog p {
    margin: 0 0 22px;
    font-size: clamp(24px, 4vw, 38px);
    line-height: 1.1;
    font-weight: 700;
    text-transform: uppercase;
  }
  dialog button {
    background: #001E50;
    color: white;
    border: 0;
    padding: 14px 26px;
    font-size: 16px;
    font-family: inherit;
    text-transform: uppercase;
    border-radius: 999px;
    cursor: pointer;
  }
  @media (max-aspect-ratio: 3/4) {
    main { width: min(100%, 57vh); min-width: 0; }
    .brand .line1, .brand .line2 { white-space: normal; }
  }
  @media (prefers-reduced-motion: reduce) {
    .wheel { will-change: auto; }
  }
.brand{width:72%;margin-bottom:4vh}.heading{width:82%;margin-bottom:1.6vh}.stage{width:94%}.footer{width:18%}
</style>
</head>

const units = 1000;
const svg = document.getElementById('wheel');
const ns = 'http://www.w3.org/2000/svg';
const blue = '#001E50', lightBlue = '#A9C7E8';
const step = 360 / prizes.length, center=50, radius=48;
function polar(r,deg){const a=(deg-90)*Math.PI/180;return {x:center+r*Math.cos(a),y:center+r*Math.sin(a)};}
function add(tag,attrs,parent=svg){const el=document.createElementNS(ns,tag);for(const [k,v] of Object.entries(attrs))el.setAttribute(k,v);parent.appendChild(el);return el;}
prizes.forEach((lines,i)=>{
 const start=i*step,end=start+step, a=polar(radius,start),b=polar(radius,end);
 add('path',{d:`M 50 50 L ${a.x} ${a.y} A ${radius} ${radius} 0 0 1 ${b.x} ${b.y} Z`,fill:i%2?blue:'#FFFFFF'});
 const mid=start+step/2, p=polar(30,mid);
 // Radial labels: avoid hub and outer rim; flip the left half for readability.
 let angle=mid-90;if(angle>90)angle-=180;
 const group=add('g',{transform:`translate(${p.x} ${p.y}) rotate(${angle})`,fill:i%2?'#FFFFFF':blue});
 lines.forEach((line,j)=>{
   if (!outlines[line]) {
     const t=add('text',{'text-anchor':'middle',y:(j-(lines.length-1)/2)*4.3+1.3,'font-size':3.8,'font-family':'Arial, sans-serif','font-weight':500,textLength:line.length>9?29:undefined},group);
     if(line.length<=9)t.removeAttribute('textLength'); else t.setAttribute('lengthAdjust','spacingAndGlyphs');
     t.textContent=line; return;
   }
   const item=outlines[line],scale=Math.min(3.8/units,30/item.width);
   const baseline=(j-(lines.length-1)/2)*4.3+1.3;
   const t=add('g',{transform:`translate(${-item.width*scale/2} ${baseline}) scale(${scale} ${-scale})`},group);
   t.innerHTML=item.svg;
 });
});
add('circle',{cx:50,cy:50,r:48.6,fill:'none',stroke:blue,'stroke-width':2.4});
const spin=document.getElementById('spin'),dialog=document.getElementById('result'),resultText=document.getElementById('resultText');
let rotation=0,busy=false;
function choosePrizeIndex(){let n=Math.random()*100;for(let i=0;i<weights.length;i++){n-=weights[i];if(n<0)return i;}return weights.length-1;}
spin.addEventListener('click',()=>{
 if(busy)return;busy=true;spin.disabled=true;
 const index=choosePrizeIndex(), target=360-(index*step+step/2), turns=6+Math.floor(Math.random()*2);
 rotation+=turns*360+((target-rotation%360+360)%360);
 const duration=window.matchMedia('(prefers-reduced-motion: reduce)').matches?100:5600;
 let completed=false,timer;
 const done=()=>{if(completed)return;completed=true;clearTimeout(timer);svg.removeEventListener('transitionend',done);resultText.textContent=prizes[index].join(' ');dialog.showModal();busy=false;spin.disabled=false;};
 svg.addEventListener('transitionend',done,{once:true});
 svg.style.transition=`transform ${duration}ms cubic-bezier(.12,.85,.15,1)`;
 svg.style.transform=`rotate(${rotation}deg)`;
 timer=setTimeout(done,duration+200);
});
document.getElementById('closeResult').addEventListener('click',()=>dialog.close());
document.getElementById('full').addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();}catch(e){}});
</script>
